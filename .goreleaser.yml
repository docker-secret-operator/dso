archives:
  - id: default
    format: tar.gz
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/**/*
    name_template: >-
      {{- .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
  algorithm: sha256

# Sign the checksum file with cosign keyless signing (OIDC-based, no long-lived key).
# Produces a .sig and .pem certificate alongside the checksum file.
# [M0-05] cosign 3.x (pinned in release.yml) defaults to the new bundle format and
# REFUSES --output-signature/--output-certificate with it ("must specify --bundle with
# --new-bundle-format"; verified with cosign 3.1.4). scripts/install.sh verifies the
# legacy detached signature + certificate, so signing must request that format:
# --new-bundle-format=false and --use-signing-config=false (the latter is required
# alongside the former; both are deprecated flags but are the supported way to get
# detached files from cosign 3).
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --new-bundle-format=false
      - --use-signing-config=false
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

# Generate a CycloneDX SBOM for each release archive using syft (already
# installed in .github/workflows/release.yml).
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=${document}"]

snapshot:
  name_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^typo:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: docker-secret-operator
    name: dso
  draft: false
  prerelease: auto
  name_template: "DSO {{ .Version }}"
