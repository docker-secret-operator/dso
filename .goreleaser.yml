project_name: dso
version: 2
dist: ./dist

builds:
  - id: docker-dso
    main: ./cmd/dso
    binary: docker-dso
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    # [M0-05] Fail the release (before anything is published) if a binary carries the
    # test-only fault-injection hook, i.e. was built with -tags=dsofault.
    hooks:
      post:
        - sh scripts/check-no-fault-hook.sh "{{ .Path }}"

  - id: dso-provider-aws
