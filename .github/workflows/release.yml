name: Release

on:
  push:
    tags:
      - "v*"   # Trigger on any tag matching v*, e.g. v3.4.0, v3.4.1-rc1

permissions:
  contents: write      # Required for GoReleaser to create GitHub Releases
  id-token: write      # Required for cosign keyless signing (OIDC token)
  packages: write      # Required if publishing container images

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      # [M0-05] A release must never be built with the test-only `dsofault` crash
      # hook. Neutralise inherited Go flag sources (GOFLAGS, the `go env -w` file);
      # the "Assert release build environment" step proves it and the
      # "Verify no fault hook" step inspects every produced binary.
      GOFLAGS: ""
      GOENV: "off"

    steps:
      # ── 1. Checkout with full history for changelog generation ────────────
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0    # Full history needed for GoReleaser changelog

      # ── 2. Set up Go (matches go.mod requirement) ─────────────────────────
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod   # Reads Go version from go.mod exactly

      # ── 3. Cache Go modules ───────────────────────────────────────────────
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # ── 4. Install cosign for keyless release signing ─────────────────────
      # [M0-05] Both the action (full commit SHA of tag v4.1.3, resolved from the
      # sigstore/cosign-installer repository) and the cosign binary it installs are
      # pinned. The installer action itself verifies the downloaded cosign against
      # a checksum embedded in the pinned action revision. The signing cosign is
      # therefore fixed by this file, not by whatever a floating tag points to at run
      # time. scripts/install.sh verifies with the same major cosign line.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Assert cosign version
        run: |
          set -euo pipefail
          cosign version | tee /tmp/cosign-version.txt
          grep -q '^GitVersion:[[:space:]]*v3\.1\.4$' /tmp/cosign-version.txt

      # ── 5. Install syft for SBOM generation ───────────────────────────────
      # Pinned, not "latest": v3.5.22's release attempt failed with
      # "cataloging artifacts: command did not write any files" from an
      # unpinned syft pulled at run time (a new syft release had landed 2
      # days prior). v1.48.0 is the version that was actually "latest" --
      # and worked -- for v3.5.21, the last successful release. Pinning
      # removes this class of failure regardless of the exact mechanism;
      # bump deliberately when ready to test a newer syft, not by drift.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.48.0

      # ── 6. Release-build guard: no inherited -tags (esp. dsofault) ─────────
      - name: Assert release build environment
        run: scripts/check-release-env.sh

      # ── 7. Validate build before release ──────────────────────────────────
      - name: Verify build
        run: make build && ls -lh docker-dso && scripts/check-no-fault-hook.sh docker-dso

      # ── 8. Clean artifacts before release ─────────────────────────────────
      - name: Clean build artifacts
        run: |
          make clean
          echo "✅ Build artifacts cleaned"

      # ── 9. Run GoReleaser (builds, signs checksum, generates SBOMs) ────────
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.0   # [M0-05] exact GoReleaser release, not a floating series
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
